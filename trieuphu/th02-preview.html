<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ai là triệu phú · Bản xem trước</title>
  <style>* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f2f2f2;
  color: #222;
  font-family: Arial, sans-serif;
}

button, input, select { font: inherit; }
button { cursor: pointer; }

.top {
  padding: 16px 6%;
  background: #fff;
  border-bottom: 1px solid #ccc;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.brand { font-size: 20px; font-weight: bold; }
.brand i { color: #d99a22; font-style: normal; }
.nav { display: flex; gap: 8px; }
.nav button {
  padding: 9px 12px;
  color: #333;
  background: #eee;
  border: 1px solid #bbb;
  border-radius: 4px;
}
.nav button.active, .nav button:hover { color: #fff; background: #555; }
.shell { width: 90%; max-width: 1000px; margin: 30px auto; }
.grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 250px;
  gap: 18px;
  align-items: start;
}
.card {
  padding: 22px;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 5px;
}
.eyebrow { color: #666; font-size: 13px; }
.title { margin: 10px 0 14px; font-size: 32px; }
.muted { color: #555; line-height: 1.6; }
.field {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  color: #222;
  background: #fff;
  border: 1px solid #aaa;
  border-radius: 4px;
}
.primary, .secondary, .lifeline {
  padding: 10px 14px;
  color: #222;
  background: #eee;
  border: 1px solid #999;
  border-radius: 4px;
}
.primary { color: #fff; background: #555; }
.primary:hover, .secondary:hover, .lifeline:hover { background: #ddd; color: #222; }
.primary:disabled, .lifeline:disabled { opacity: 0.5; cursor: not-allowed; }
.actions, .lifelines { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 22px; }
.rule { padding: 12px; background: #f7f7f7; border: 1px solid #ddd; border-radius: 4px; }
.rule b { display: block; margin-bottom: 5px; }
.record { margin-top: 18px; padding: 12px; background: #fff8df; border: 1px solid #e5d59b; }
.game-head { display: flex; align-items: center; justify-content: space-between; }
.timer { font-size: 24px; font-weight: bold; }
.timer.low, .answer.wrong { color: #a00; }
.timer small { display: block; color: #555; font-size: 12px; text-align: center; }
.question { margin: 20px 0; padding: 16px; background: #f7f7f7; border: 1px solid #bbb; font-size: 19px; line-height: 1.5; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.answer {
  min-height: 54px;
  padding: 12px;
  color: #222;
  background: #fff;
  border: 1px solid #999;
  border-radius: 4px;
  text-align: left;
}
.answer:hover:not(:disabled) { background: #eee; }
.answer.locked { background: #ffe3a3; }
.answer.correct { background: #d8f0d8; border-color: #4a8a4a; }
.answer.wrong { background: #f4dada; border-color: #a44; }
.answer:disabled { cursor: default; }
.ladder { display: flex; flex-direction: column-reverse; gap: 3px; }
.step { display: flex; gap: 10px; padding: 6px 8px; color: #444; font-size: 13px; }
.step strong { width: 24px; }
.step.safe { font-weight: bold; }
.step.current { background: #fff0bd; font-weight: bold; }
.audience { display: flex; gap: 8px; margin-top: 14px; }
.bar { flex: 1; padding: 8px; background: #f2f2f2; border: 1px solid #ddd; font-size: 12px; }
.bar span { display: block; height: 8px; margin-top: 6px; background: #888; }
.table-wrap { margin-top: 16px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; }
th, td { padding: 10px; border-bottom: 1px solid #ddd; }
th { background: #f2f2f2; }
a { color: #245a8d; cursor: pointer; }
.status, footer { color: #666; font-size: 13px; }
.status { margin-top: 12px; }
footer { padding: 20px; text-align: center; }

@media (max-width: 700px) {
  .grid { grid-template-columns: 1fr; }
  .rules, .answers { grid-template-columns: 1fr; }
  .title { font-size: 26px; }
}
</style>
</head>
<body>
  <header class="top"><div class="brand"><i>✦</i> AI LÀ TRIỆU PHÚ</div><nav class="nav" id="nav"></nav></header>
  <main class="shell" id="app"></main><footer>BẢN XEM TRƯỚC TH02 · HTML / CSS / JAVASCRIPT</footer>
  <script>
    const BUILD_TAG = "tp-4186";
    const PRIZES=[200000,400000,600000,1000000,2000000,3000000,6000000,10000000,14000000,22000000,30000000,40000000,80000000,150000000,250000000];
    const MILESTONES=[5,10,15], LEVELS={1:'Dễ',2:'Trung bình',3:'Khó'}, LETTERS=['A','B','C','D'], TIME=30, HISTORY_KEY='ltw_trieuphu_history';
    const QUESTIONS=[
      {id:1,level:1,question:'Thẻ HTML nào dùng để tạo một liên kết (hyperlink)?',options:['<link>','<a>','<href>','<nav>'],answer:1},
      {id:2,level:1,question:'Selector CSS nào chọn phần tử có id="header"?',options:['.header','header','#header','*header'],answer:2},
      {id:3,level:1,question:'Thẻ HTML nào tạo danh sách có đánh số thứ tự?',options:['<ol>','<ul>','<li>','<dl>'],answer:0},
      {id:4,level:1,question:'Thuộc tính CSS nào dùng để đổi màu chữ?',options:['font-color','text-color','background-color','color'],answer:3},
      {id:5,level:1,question:'Trong React, dữ liệu truyền từ component cha xuống component con gọi là gì?',options:['state','props','ref','key'],answer:1},
      {id:6,level:2,question:'Từ khóa ES6 nào khai báo biến không thể gán lại giá trị?',options:['var','let','const','static'],answer:2},
      {id:7,level:2,question:'[1, 2, 3].map(x => x * 2) trả về kết quả nào?',options:['[2, 4, 6]','[1, 2, 3]','12','undefined'],answer:0},
      {id:8,level:2,question:'Hook nào dùng để khai báo state trong function component?',options:['useEffect','useParams','useNavigate','useState'],answer:3},
      {id:9,level:2,question:'Template literal `${1 + 1}` cho ra chuỗi nào?',options:['"1 + 1"','"2"','"11"','"${2}"'],answer:1},
      {id:10,level:2,question:'useEffect(fn, []) chạy hàm fn khi nào?',options:['Sau mỗi lần render','Chỉ khi component bị gỡ','Một lần, sau lần render đầu tiên','Không bao giờ chạy'],answer:2},
      {id:11,level:3,question:'Trong nested route, component nào là chỗ hiển thị route con?',options:['<Outlet />','<Route />','<Link />','<Routes />'],answer:0},
      {id:12,level:3,question:'Hook nào đọc giá trị :id trên URL /courses/:id?',options:['useLocation','useNavigate','useParams','useState'],answer:2},
      {id:13,level:3,question:'Gọi navigate(-1) có tác dụng gì?',options:['Tải lại trang','Về trang chủ','Xóa lịch sử duyệt web','Quay lại trang trước đó'],answer:3},
      {id:14,level:3,question:'Hàm cleanup (return) trong useEffect thường dùng để làm gì?',options:['Khởi tạo state ban đầu','Hủy timer, gỡ sự kiện trước khi component bị gỡ','Gọi API lần đầu','Bắt component render lại'],answer:1},
      {id:15,level:3,question:'const { a, ...rest } = { a: 1, b: 2, c: 3 }; rest có giá trị nào?',options:['{ a: 1 }','[2, 3]','{ b: 2, c: 3 }','undefined'],answer:2}
    ];
    const formatMoney=n=>`${Number(n||0).toLocaleString('vi-VN')} đ`;
    let page='/', playerName='', game=null, history=loadHistory(), query='', level='all', result=null;
    function loadHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch{return []}}
    function saveHistory(){localStorage.setItem(HISTORY_KEY,JSON.stringify(history))}
    function calcPrize(correctCount,reason){if(reason==='won')return PRIZES[14];if(reason==='stop')return PRIZES[correctCount-1]||0;const milestone=MILESTONES.filter(n=>n<=correctCount).pop();return milestone?PRIZES[milestone-1]:0}
    function handleQueryShift(event){query=event.target.value;render()}
    function currentPage(){if(location.protocol==='file:')return location.hash.slice(1)||'/';return location.pathname}
    function go(path){if(game?.timerId)clearInterval(game.timerId);if(game?.stepId)clearTimeout(game.stepId);page=path;window.history.pushState({},'',location.protocol==='file:'?`#${path}`:path);render()}
    function syncPage(){page=currentPage();render()}
    window.addEventListener('popstate',syncPage);
    window.addEventListener('hashchange',syncPage);
    function startGame(){const name=document.querySelector('#player')?.value.trim();if(!name)return;playerName=name;game={index:0,seconds:TIME,status:'answering',selected:null,hidden:[],used:{},chart:null,stepId:null,timerId:null};go('/play');tick()}
    function tick(){if(!game||game.status!=='answering')return;game.timerId=setInterval(()=>{if(!game||game.status!=='answering')return;game.seconds--;if(game.seconds<=0){clearInterval(game.timerId);endGame('timeout')}render()},1000)}
    function choose(index){if(!game||game.status!=='answering'||game.hidden.includes(index))return;clearInterval(game.timerId);game.selected=index;game.status='locked';render();game.stepId=setTimeout(()=>{if(!game)return;game.status='revealed';render();game.stepId=setTimeout(()=>{if(!game)return;if(index===QUESTIONS[game.index].answer){game.index++;if(game.index===15){endGame('won');return}game.seconds=TIME;game.status='answering';game.selected=null;game.chart=null;render();tick()}else endGame('wrong')},2000)},1000)}
    function endGame(reason){if(!game)return;clearInterval(game.timerId);clearTimeout(game.stepId);const count=game.index+(reason==='won'?0:0);const prize=calcPrize(count,reason);result={name:playerName,correctCount:count,prize,reason};history.unshift({id:Date.now(),name:playerName,prize,correctCount:count,playedAt:new Date().toLocaleString('vi-VN')});saveHistory();game=null;go('/result')}
    function use5050(){if(!game||game.used.fifty)return;const q=QUESTIONS[game.index],wrong=q.options.map((_,i)=>i).filter(i=>i!==q.answer);for(let i=wrong.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[wrong[i],wrong[j]]=[wrong[j],wrong[i]]}game.hidden=wrong.slice(0,2);game.used.fifty=true;render()}
    function useAudience(){if(!game||game.used.audience)return;const q=QUESTIONS[game.index],shown=q.options.map((_,i)=>i).filter(i=>!game.hidden.includes(i)),correct=Math.floor(Math.random()*31)+40,remaining=100-correct;const vals=[0,0,0,0];vals[q.answer]=correct;let left=remaining;shown.filter(i=>i!==q.answer).forEach((i,pos,arr)=>{vals[i]=pos===arr.length-1?left:Math.floor(Math.random()*(left+1));left-=vals[i]});game.chart=vals;game.used.audience=true;render()}
    function stopGame(){endGame('stop')}
    document.addEventListener('keydown',e=>{if(!game||page!='/play'||game.status!=='answering')return;const i=LETTERS.indexOf(e.key.toUpperCase());if(i>=0)choose(i)});
    function nav(){return `<button class="${page==='/'?'active':''}" onclick="go('/')">Trang chủ</button><button class="${page.startsWith('/questions')?'active':''}" onclick="go('/questions')">Ngân hàng câu hỏi</button><button class="${page==='/history'?'active':''}" onclick="go('/history')">Lịch sử</button>`}
    function home(){const best=[...history].sort((a,b)=>b.prize-a.prize)[0];return `<section class="card"><div class="eyebrow">Sân chơi kiến thức · 15 câu hỏi</div><h1 class="title">Chinh phục đỉnh cao<br>triệu phú!</h1><p class="muted">Trả lời 15 câu hỏi về HTML, CSS, JavaScript và React. Mỗi câu có 30 giây. Dùng quyền trợ giúp đúng lúc và mang giải thưởng lớn về nhà.</p><label class="muted" for="player">Tên người chơi</label><input id="player" class="field" placeholder="Nhập tên của bạn" value="${playerName}" oninput="document.querySelector('#start').disabled=!this.value.trim()"/><div class="actions"><button class="primary" id="start" onclick="startGame()" ${playerName?'':'disabled'}>Bắt đầu chơi　→</button></div>${best?`<div class="record"> Kỷ lục: <b>${formatMoney(best.prize)} – ${escapeHtml(best.name)}</b></div>`:''}<div class="rules"><div class="rule"><b> 30 giây</b><span class="muted">Cho mỗi câu trả lời</span></div><div class="rule"><b> 3 trợ giúp</b><span class="muted">50:50, khán giả, dừng chơi</span></div><div class="rule"><b> 250 triệu</b><span class="muted">Giải thưởng câu số 15</span></div></div></section>`}
    function ladder(){return `<aside class="card"><div class="eyebrow" style="margin-bottom:12px">Bậc tiền thưởng</div><div class="ladder">${PRIZES.map((p,i)=>{const n=i+1;return `<div class="step ${MILESTONES.includes(n)?'safe':''} ${n===game.index+1?'current':''}"><strong>${String(n).padStart(2,'0')}</strong><span>${formatMoney(p)}</span></div>`}).reverse().join('')}</div></aside>`}
    function play(){if(!game){go('/');return ''}const q=QUESTIONS[game.index];return `<div class="grid"><section class="card"><div class="game-head"><div><div class="eyebrow">Câu ${game.index+1} / 15 · ${LEVELS[q.level]}</div><h2 style="margin:7px 0">${escapeHtml(playerName)}</h2></div><div class="timer ${game.seconds<=10?'low':''}">${game.seconds}<small>GIÂY</small></div></div><div class="question">${escapeHtml(q.question)}</div><div class="answers">${q.options.map((opt,i)=>{let cls='';if(game.status==='locked'&&game.selected===i)cls='locked';if(game.status==='revealed'&&i===q.answer)cls='correct';if(game.status==='revealed'&&game.selected===i&&i!==q.answer)cls='wrong';return `<button class="answer ${cls}" onclick="choose(${i})" ${game.status!=='answering'||game.hidden.includes(i)?'disabled':''}>${game.hidden.includes(i)?'':`${LETTERS[i]}. ${escapeHtml(opt)}`}</button>`}).join('')}</div><div class="lifelines"><button class="lifeline" onclick="use5050()" ${game.used.fifty?'disabled':''}>　50:50</button><button class="lifeline" onclick="useAudience()" ${game.used.audience?'disabled':''}>　Hỏi khán giả</button><button class="lifeline" onclick="stopGame()" ${game.status!=='answering'?'disabled':''}>　Dừng chơi</button></div>${game.chart?`<div class="audience">${game.chart.map((v,i)=>`<div class="bar">${LETTERS[i]}: ${v}%<span style="width:${v}%"></span></div>`).join('')}</div>`:''}<div class="status">Phím tắt: A · B · C · D ${game.status==='locked'?' — Đang chốt đáp án…':game.status==='revealed'?' — Đã mở đáp án.':''}</div></section>${ladder()}</div>`}
    function resultPage(){if(!result)return `<section class="card"><h1 class="title">Chưa có kết quả</h1><button class="primary" onclick="go('/')">Về trang chủ</button></section>`;const title={won:'Chúc mừng! Bạn đã trở thành triệu phú',wrong:'Rất tiếc, bạn đã trả lời sai',timeout:'Hết giờ!',stop:'Bạn đã dừng cuộc chơi'}[result.reason];return `<section class="card" style="text-align:center"><div style="font-size:48px">${result.reason==='won'?'':''}</div><div class="eyebrow">Kết quả lượt chơi</div><h1 class="title">${title}</h1><p class="muted">Người chơi: <b>${escapeHtml(result.name)}</b><br>Số câu trả lời đúng: <b>${result.correctCount}</b><br>Tiền thưởng: <b style="color:#ffd273;font-size:24px">${formatMoney(result.prize)}</b></p><div class="actions" style="justify-content:center"><button class="primary" onclick="playerName='${escapeAttr(result.name)}';startGame()">Chơi lại</button><button class="secondary" onclick="go('/')">Về trang chủ</button></div></section>`}
    function bank(){const list=QUESTIONS.filter(q=>(level==='all'||q.level===Number(level))&&q.question.toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')));return `<section class="card"><div class="eyebrow">Khám phá kiến thức</div><h1 class="title">Ngân hàng câu hỏi</h1><div class="grid" style="grid-template-columns:200px 1fr;gap:12px"><select class="field" onchange="level=this.value;render()"><option value="all" ${level==='all'?'selected':''}>Tất cả mức độ</option>${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}" ${level===k?'selected':''}>${v}</option>`).join('')}</select><input id="query" class="field" placeholder="Tìm theo nội dung câu hỏi…" value="${escapeAttr(query)}" oninput="handleQueryShift(event)"></div><p class="muted">Có ${list.length} câu hỏi</p><div class="table-wrap"><table><thead><tr><th>STT</th><th>Mức độ</th><th>Câu hỏi</th></tr></thead><tbody>${list.map(q=>`<tr><td>${q.id}</td><td>${LEVELS[q.level]}</td><td><a onclick="go('/questions/${q.id}')">${escapeHtml(q.question)}</a></td></tr>`).join('')||'<tr><td colspan="3">Không có câu hỏi phù hợp</td></tr>'}</tbody></table></div></section>`}
    function detail(id){const q=QUESTIONS.find(x=>x.id===Number(id));if(!q)return `<section class="card"><h2>Không tìm thấy câu hỏi</h2><button class="secondary" onclick="go('/questions')">Quay lại</button></section>`;return `<section class="card"><div class="eyebrow">Câu hỏi số ${q.id} (${LEVELS[q.level]})</div><h1 class="title">${escapeHtml(q.question)}</h1>${q.options.map((o,i)=>`<div class="answer ${i===q.answer?'correct':''}" style="margin:9px 0">${LETTERS[i]}. ${escapeHtml(o)}${i===q.answer?'　✓ Đáp án đúng':''}</div>`).join('')}<div class="actions"><button class="secondary" onclick="go('/questions')">← Quay lại</button></div></section>`}
    function historyPage(){const sorted=[...history].sort((a,b)=>b.prize-a.prize),sum=history.reduce((s,x)=>s+x.prize,0),best=sorted[0];return `<section class="card"><div class="eyebrow">Thành tích của bạn</div><h1 class="title">Lịch sử lượt chơi</h1><div class="rules"><div class="rule"><b>Số lượt chơi: ${history.length}</b></div><div class="rule"><b>Tiền thưởng cao nhất: ${formatMoney(best?.prize||0)}</b></div><div class="rule"><b>Tổng tiền thưởng: ${formatMoney(sum)}</b></div></div>${history.length?`<div class="table-wrap"><table><thead><tr><th>Người chơi</th><th>Số câu đúng</th><th>Tiền thưởng</th><th>Thời gian</th></tr></thead><tbody>${sorted.map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${x.correctCount}</td><td>${formatMoney(x.prize)}</td><td>${escapeHtml(x.playedAt)}</td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="secondary" onclick="history=[];saveHistory();render()">Xóa lịch sử</button></div>`:'<p class="muted">Chưa có lượt chơi nào.</p>'}</section>`}
    function render(){document.title=page==='/play'&&game?`Câu ${game.index+1}/15 – ${playerName}`:'Ai là triệu phú';document.querySelector('#nav').innerHTML=nav();const path=currentPage();let body=path==='/'?home():path==='/play'?play():path==='/result'?resultPage():path==='/history'?historyPage():path==='/questions'?bank():path.startsWith('/questions/')?detail(path.split('/')[2]):`<section class="card"><h1 class="title">404 - Không tìm thấy trang</h1><button class="primary" onclick="go('/')">Về trang chủ</button></section>`;document.querySelector('#app').innerHTML=body}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHtml(s)}
    page=currentPage();render();
  </script>
</body>
</html>
